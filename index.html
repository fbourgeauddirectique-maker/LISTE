<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Courses">
<meta name="theme-color" content="#1F55B0" id="themeColor">
<link rel="apple-touch-icon" id="touchIcon" href="">
<title>Courses par enseigne</title>
<style>
:root{
  --accent:#1F55B0;
  --bg:#F2F4F5;
  --surface:#FFFFFF;
  --ink:#14181C;
  --muted:#69727A;
  --line:#E1E5E8;
  --chip:#E4E8EB;
  --danger:#C8281F;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --display:"Avenir Next Condensed","Avenir Next","Futura","Arial Narrow",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0F1214;
    --surface:#1A1E21;
    --ink:#F1F3F4;
    --muted:#8C959C;
    --line:#2A3035;
    --chip:#252A2E;
    --danger:#FF6B61;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:17px/1.35 var(--sans);-webkit-text-size-adjust:100%}
body{overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

#app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* En-tête : la couleur et le nom de l'enseigne */
.hero{
  flex-shrink:0;
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
  padding:calc(env(safe-area-inset-top) + 16px) 20px 18px;
  background:var(--accent);color:#fff;
  transition:background-color .25s;
}
.hero h1{
  margin:0;font:800 clamp(46px,15vw,66px)/.95 var(--display);
  letter-spacing:-.01em;overflow-wrap:anywhere;
}
.hero .sub{margin:6px 0 0;font-size:16px;opacity:.9}
.hero .more{
  flex-shrink:0;width:44px;height:44px;border:0;border-radius:50%;
  background:rgba(255,255,255,.22);color:#fff;display:grid;place-items:center;
}
.hero .more:focus-visible{outline-color:#fff}

/* Onglets */
.seg{flex-shrink:0;display:flex;gap:8px;padding:14px 16px 4px}
.seg button{
  flex:1;border:0;border-radius:12px;padding:11px 8px;
  background:var(--chip);font-weight:600;font-size:16px;
}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.seg .n{margin-left:6px;opacity:.6;font-weight:500}

/* Contenu */
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 16px 28px}
.add{display:flex;gap:8px;margin:6px 0 4px}
.add input{
  flex:1;min-width:0;height:48px;padding:0 14px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--surface);font-size:17px;
}
.add input::placeholder{color:var(--muted)}
.add input:focus{outline:none;border-color:var(--accent)}
.add button{
  height:48px;padding:0 16px;border:0;border-radius:12px;
  background:var(--accent);color:#fff;font-weight:700;font-size:16px;
}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;margin:6px 2px 4px;color:var(--muted);font-size:15px}
.bar button{border:0;background:none;padding:10px 0 10px 12px;color:var(--accent);font-weight:600;font-size:15px}
@media (prefers-color-scheme:dark){.bar button{color:#fff}}

.group{background:var(--surface);border-radius:14px;overflow:hidden}
.row{
  display:flex;align-items:center;gap:14px;width:100%;min-height:58px;
  padding:0 16px;border:0;border-top:1px solid var(--line);
  background:none;text-align:left;
}
.row:first-child{border-top:0}
.row .name{flex:1;min-width:0;overflow-wrap:anywhere}
.row.done .name{color:var(--muted);text-decoration:line-through}
.tick{
  flex-shrink:0;width:26px;height:26px;border-radius:50%;
  border:2px solid var(--muted);display:grid;place-items:center;color:#fff;
}
.tick svg{opacity:0}
.row.done .tick{background:var(--accent);border-color:var(--accent)}
.row.done .tick svg{opacity:1}
.pill{
  flex-shrink:0;padding:6px 12px;border-radius:999px;
  border:1.5px solid var(--line);font-size:15px;font-weight:600;color:var(--muted);
}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.edit-row{display:flex;align-items:center;border-top:1px solid var(--line);min-height:58px}
.edit-row:first-child{border-top:0}
.edit-row .name{flex:1;min-width:0;padding:16px;border:0;background:none;text-align:left;overflow-wrap:anywhere}
.edit-row .del{border:0;background:none;padding:16px;color:var(--danger);font-weight:600;font-size:15px}

.empty{padding:34px 8px;text-align:center;color:var(--muted)}
.empty p{margin:0 auto 16px;max-width:30ch}
.empty button{
  border:0;border-radius:12px;padding:12px 18px;background:var(--accent);color:#fff;font-weight:700;font-size:16px;
}

/* Barre des enseignes */
.nav{
  flex-shrink:0;display:flex;gap:8px;overflow-x:auto;
  padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);
  background:var(--surface);border-top:1px solid var(--line);
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.nav::-webkit-scrollbar{display:none}
body.typing .nav{display:none}
.chip{
  flex-shrink:0;display:flex;align-items:center;gap:8px;
  padding:10px 14px;border-radius:999px;border:1.5px solid var(--line);
  background:none;font-weight:600;font-size:15px;white-space:nowrap;
}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip .badge{
  min-width:20px;height:20px;padding:0 6px;border-radius:10px;
  background:var(--chip);font-size:13px;display:grid;place-items:center;
}
.chip.on{background:var(--c);border-color:var(--c);color:#fff}
.chip.on .dot{background:#fff}
.chip.on .badge{background:rgba(255,255,255,.28)}
.chip.add{border-style:dashed;color:var(--muted)}

/* Feuille modale */
.overlay{
  position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.4);
  display:flex;align-items:flex-end;
  visibility:hidden;opacity:0;transition:opacity .2s,visibility .2s;
}
.overlay.open{visibility:visible;opacity:1}
.sheet{
  width:100%;max-height:92dvh;overflow-y:auto;background:var(--surface);
  border-radius:22px 22px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 20px);
  transform:translateY(30px);transition:transform .25s;
}
.overlay.open .sheet{transform:none}
.sheet h2{margin:0 0 16px;font-size:22px}
.sheet label{display:block;margin:14px 0 6px;font-size:14px;font-weight:600;color:var(--muted)}
.sheet input[type=text],.sheet textarea{
  width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--bg);font-size:17px;
}
.sheet textarea{height:150px;font:13px/1.4 ui-monospace,Menlo,monospace;resize:none}
.sheet input:focus,.sheet textarea:focus{outline:none;border-color:var(--accent)}
.swatches{display:flex;flex-wrap:wrap;gap:12px}
.swatches button{
  width:42px;height:42px;border-radius:50%;border:0;background:var(--c);
  box-shadow:0 0 0 0 var(--surface),0 0 0 0 var(--c);
}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--c)}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:22px}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--chip);font-weight:600;font-size:17px}
.btn.primary{background:var(--accent);color:#fff;font-weight:700}
.btn.danger{background:none;color:var(--danger)}
.btn.link{background:none;color:var(--muted);font-size:15px}
.hint{margin:0 0 4px;color:var(--muted);font-size:15px}

.toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);z-index:20;
  transform:translate(-50%,10px);padding:10px 16px;border-radius:12px;
  background:var(--ink);color:var(--bg);font-size:15px;max-width:86vw;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="hero">
    <div>
      <h1 id="title"></h1>
      <p class="sub" id="sub"></p>
    </div>
    <button class="more" id="editStore" aria-label="Modifier l'enseigne">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
  </header>

  <div class="seg" role="tablist">
    <button role="tab" id="tabBuy">À acheter<span class="n" id="nBuy"></span></button>
    <button role="tab" id="tabProd">Mes produits<span class="n" id="nProd"></span></button>
  </div>

  <main id="main">
    <form class="add" id="addForm" autocomplete="off">
      <input id="addInput" type="text" enterkeyhint="done" autocapitalize="sentences" maxlength="60" aria-label="Nom du produit">
      <button type="submit">Ajouter</button>
    </form>
    <div id="host"></div>
  </main>

  <nav class="nav" id="nav" aria-label="Enseignes"></nav>
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';

var KEY = 'courses-enseignes-v1';
var COLORS = [
  ['Bleu','#1F55B0'],['Rouge','#C8281F'],['Orange','#D9631A'],['Vert','#2F7D4A'],
  ['Violet','#6A47A8'],['Rose','#C23A74'],['Ardoise','#3A4753'],['Brun','#8A5A2B']
];
// st : 0 = dans mes produits, 1 = à acheter, 2 = pris
function uid(){ return Math.random().toString(36).slice(2,10); }
function mkStore(name,color){ return {id:uid(),name:name,color:color,products:[]}; }
function defaults(){
  var s = [mkStore('Lidl',COLORS[0][1]),mkStore('Carrefour',COLORS[1][1]),mkStore('Mon Marché',COLORS[2][1]),mkStore('Natulalia',COLORS[3][1])];
  return {stores:s,current:s[0].id,view:'buy'};
}
function valid(s){
  return s && Array.isArray(s.stores) && s.stores.length && s.stores.every(function(x){
    return x && typeof x.name==='string' && typeof x.color==='string' && Array.isArray(x.products);
  });
}
function load(){
  try{
    var r = localStorage.getItem(KEY);
    if(r){ var s = JSON.parse(r); if(valid(s)) return s; }
  }catch(e){}
  return defaults();
}
var state = load();
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} }

var $ = function(id){ return document.getElementById(id); };
var editing = false;

function h(tag,props){
  var e = document.createElement(tag);
  props = props || {};
  Object.keys(props).forEach(function(k){
    var v = props[k];
    if(v===null||v===undefined||v===false) return;
    if(k==='class') e.className = v;
    else if(k==='style') e.style.cssText = v;
    else if(k.indexOf('on')===0) e.addEventListener(k.slice(2),v);
    else e.setAttribute(k, v===true ? '' : v);
  });
  for(var i=2;i<arguments.length;i++){
    var kids = [].concat(arguments[i]);
    kids.forEach(function(c){
      if(c===null||c===undefined||c===false) return;
      e.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
    });
  }
  return e;
}
function icon(html){ var s = document.createElement('span'); s.style.display='contents'; s.innerHTML = html; return s; }
var CHECK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function cur(){
  for(var i=0;i<state.stores.length;i++) if(state.stores[i].id===state.current) return state.stores[i];
  state.current = state.stores[0].id;
  return state.stores[0];
}
function byName(a,b){ return a.name.localeCompare(b.name,'fr',{sensitivity:'base'}); }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function count(s,st){ return s.products.filter(function(p){ return p.st===st; }).length; }

var toastTimer;
function toast(msg){
  var t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('show'); },2000);
}

/* ---------- Rendu ---------- */
function render(){
  var s = cur();
  document.documentElement.style.setProperty('--accent',s.color);
  $('themeColor').setAttribute('content',s.color);
  $('title').textContent = s.name;

  var need = count(s,1), done = count(s,2), total = s.products.length;
  $('sub').textContent = need+done===0 ? 'Rien dans la liste' : need+' à acheter'+(done?', '+done+' pris':'');
  $('nBuy').textContent = need+done;
  $('nProd').textContent = total;

  var buy = state.view==='buy';
  $('tabBuy').setAttribute('aria-selected',buy);
  $('tabProd').setAttribute('aria-selected',!buy);
  $('addInput').placeholder = buy ? 'Ajouter à la liste' : 'Nouveau produit pour '+s.name;

  renderList(s,buy);
  renderNav();
}

function renderList(s,buy){
  var host = $('host');
  host.replaceChildren();
  var bar, group;

  if(buy){
    var items = s.products.filter(function(p){ return p.st>0; })
      .sort(function(a,b){ return a.st-b.st || byName(a,b); });
    var done = items.filter(function(p){ return p.st===2; }).length;
    if(!items.length){
      host.appendChild(h('div',{class:'empty'},
        h('p',null,'Rien à acheter chez '+s.name+' pour le moment.'),
        s.products.length ? h('button',{onclick:function(){ setView('prod'); }},'Choisir dans mes produits') : null));
      return;
    }
    bar = h('div',{class:'bar'},
      h('span',null,(items.length-done)+' à acheter'+(done?', '+done+' pris':'')),
      done ? h('button',{onclick:clearDone},'Retirer les produits pris') : null);
    group = h('div',{class:'group'}, items.map(function(p){
      return h('button',{class:'row'+(p.st===2?' done':''),role:'checkbox','aria-checked':p.st===2,
        onclick:function(){ p.st = p.st===2 ? 1 : 2; save(); render(); }},
        h('span',{class:'tick'},icon(CHECK)),
        h('span',{class:'name'},p.name));
    }));
  } else {
    var all = s.products.slice().sort(byName);
    if(!all.length){
      editing = false;
      host.appendChild(h('div',{class:'empty'},
        h('p',null,'Aucun produit pour '+s.name+'. Ajoute ceux que tu achètes souvent avec le champ ci-dessus.')));
      return;
    }
    bar = h('div',{class:'bar'},
      h('span',null,all.length+(all.length>1?' produits':' produit')),
      h('button',{onclick:function(){ editing = !editing; render(); }},editing?'Terminé':'Modifier'));
    group = h('div',{class:'group'}, all.map(function(p){
      if(editing){
        return h('div',{class:'edit-row'},
          h('button',{class:'name',onclick:function(){ renameSheet(p); }},p.name),
          h('button',{class:'del',onclick:function(){ removeProduct(p); }},'Supprimer'));
      }
      var on = p.st>0;
      return h('button',{class:'row',role:'switch','aria-checked':on,
        onclick:function(){ p.st = on ? 0 : 1; save(); render(); }},
        h('span',{class:'name'},p.name),
        h('span',{class:'pill'+(on?' on':'')},on?'Dans la liste':'Ajouter'));
    }));
  }
  host.appendChild(bar);
  host.appendChild(group);
}

function renderNav(){
  var nav = $('nav'), active = null;
  nav.replaceChildren();
  state.stores.forEach(function(s){
    var n = count(s,1), on = s.id===state.current;
    var b = h('button',{class:'chip'+(on?' on':''),style:'--c:'+s.color,'aria-current':on?'true':null,
      onclick:function(){ state.current = s.id; editing = false; save(); render(); $('main').scrollTop = 0; }},
      h('span',{class:'dot'}), s.name, n ? h('span',{class:'badge'},n) : null);
    if(on) active = b;
    nav.appendChild(b);
  });
  nav.appendChild(h('button',{class:'chip add',onclick:function(){ storeSheet(null); }},'+ Enseigne'));
  if(active) nav.scrollLeft = active.offsetLeft - (nav.clientWidth-active.offsetWidth)/2;
}

function setView(v){ state.view = v; editing = false; save(); render(); $('main').scrollTop = 0; }

/* ---------- Actions ---------- */
function clearDone(){
  cur().products.forEach(function(p){ if(p.st===2) p.st = 0; });
  save(); render();
}
function removeProduct(p){
  var s = cur();
  s.products = s.products.filter(function(x){ return x!==p; });
  save(); render();
}
function addProduct(raw){
  var name = cap(raw.trim().replace(/\s+/g,' '));
  if(!name) return false;
  var s = cur(), buy = state.view==='buy';
  var found = s.products.filter(function(p){ return p.name.toLowerCase()===name.toLowerCase(); })[0];
  if(found){
    if(buy){
      if(found.st===0){ found.st = 1; toast(found.name+' ajouté à la liste'); }
      else if(found.st===2){ found.st = 1; toast(found.name+' remis à acheter'); }
      else toast(found.name+' est déjà dans la liste');
    } else toast(found.name+' existe déjà');
  } else {
    s.products.push({id:uid(),name:name,st:buy?1:0});
  }
  save(); render();
  return true;
}

/* ---------- Feuilles ---------- */
function openSheet(build){
  var sh = $('sheet');
  sh.replaceChildren();
  build(sh);
  $('overlay').classList.add('open');
}
function closeSheet(){
  $('overlay').classList.remove('open');
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
}

function renameSheet(p){
  openSheet(function(sh){
    var input = h('input',{type:'text',value:p.name,maxlength:'60','aria-label':'Nom du produit',autocapitalize:'sentences'});
    sh.appendChild(h('h2',null,'Renommer le produit'));
    sh.appendChild(h('form',{onsubmit:function(e){
        e.preventDefault();
        var n = cap(input.value.trim().replace(/\s+/g,' '));
        if(!n) return;
        var clash = cur().products.some(function(x){ return x!==p && x.name.toLowerCase()===n.toLowerCase(); });
        if(clash){ toast(n+' existe déjà'); return; }
        p.name = n; save(); closeSheet(); render();
      }},
      input,
      h('div',{class:'actions'},
        h('button',{type:'submit',class:'btn primary'},'Enregistrer'),
        h('button',{type:'button',class:'btn',onclick:closeSheet},'Annuler'))));
  });
}

function storeSheet(id){
  var s = id ? state.stores.filter(function(x){ return x.id===id; })[0] : null;
  var color = s ? s.color : COLORS[state.stores.length % COLORS.length][1];
  openSheet(function(sh){
    var input = h('input',{type:'text',value:s?s.name:'',maxlength:'30','aria-label':"Nom de l'enseigne",autocapitalize:'words'});
    var swWrap = h('div',{class:'swatches'});
    var saveBtn = h('button',{type:'submit',class:'btn primary',style:'background:'+color},'Enregistrer');
    function paintSwatches(){
      swWrap.replaceChildren();
      COLORS.forEach(function(c){
        swWrap.appendChild(h('button',{type:'button',style:'--c:'+c[1],'aria-label':c[0],'aria-pressed':c[1]===color,
          onclick:function(){ color = c[1]; saveBtn.style.background = color; paintSwatches(); }}));
      });
    }
    paintSwatches();

    sh.appendChild(h('h2',null,s ? "Modifier l'enseigne" : 'Nouvelle enseigne'));
    sh.appendChild(h('form',{onsubmit:function(e){
        e.preventDefault();
        var n = cap(input.value.trim().replace(/\s+/g,' '));
        if(!n){ input.focus(); return; }
        var clash = state.stores.some(function(x){ return x!==s && x.name.toLowerCase()===n.toLowerCase(); });
        if(clash){ toast(n+' existe déjà'); return; }
        if(s){ s.name = n; s.color = color; }
        else {
          var ns = mkStore(n,color);
          state.stores.push(ns); state.current = ns.id; state.view = 'prod';
        }
        editing = false; save(); closeSheet(); render();
        if(!s) $('main').scrollTop = 0;
      }},
      h('label',null,'Nom'), input,
      h('label',null,'Couleur'), swWrap,
      h('div',{class:'actions'},
        saveBtn,
        h('button',{type:'button',class:'btn',onclick:closeSheet},'Annuler'),
        s && state.stores.length>1 ? h('button',{type:'button',class:'btn danger',onclick:function(){
          var n = s.products.length;
          var msg = 'Supprimer '+s.name+(n?' et ses '+n+(n>1?' produits':' produit'):'')+' ?';
          if(!confirm(msg)) return;
          state.stores = state.stores.filter(function(x){ return x!==s; });
          state.current = state.stores[0].id; editing = false;
          save(); closeSheet(); render();
        }},"Supprimer l'enseigne") : null,
        s ? h('button',{type:'button',class:'btn link',onclick:backupSheet},'Sauvegarde et synchronisation') : null)));
    if(!s) setTimeout(function(){ input.focus(); },250);
  });
}

function clean(data){
  var out = {stores:[],current:null,view:'buy'};
  data.stores.forEach(function(st){
    if(!st || typeof st.name!=='string' || !Array.isArray(st.products)) return;
    out.stores.push({
      id: typeof st.id==='string' && st.id ? st.id : uid(),
      name: st.name,
      color: typeof st.color==='string' ? st.color : COLORS[0][1],
      products: st.products.filter(function(p){ return p && typeof p.name==='string'; }).map(function(p){
        return {id: typeof p.id==='string' && p.id ? p.id : uid(), name:p.name, st:(p.st===1||p.st===2)?p.st:0};
      })
    });
  });
  if(!out.stores.length) return null;
  out.current = out.stores.some(function(x){ return x.id===data.current; }) ? data.current : out.stores[0].id;
  out.view = data.view==='prod' ? 'prod' : 'buy';
  return out;
}
function mergeData(data){
  var low = function(x){ return String(x).toLowerCase(); };
  data.stores.forEach(function(ins){
    var s = state.stores.filter(function(x){ return low(x.name)===low(ins.name); })[0];
    if(!s){ s = {id:uid(),name:ins.name,color:ins.color,products:[]}; state.stores.push(s); }
    ins.products.forEach(function(ip){
      var found = s.products.some(function(p){ return low(p.name)===low(ip.name); });
      if(!found) s.products.push({id:uid(),name:ip.name,st:ip.st});
    });
  });
}
function stamp(){
  var d = new Date(), p = function(n){ return (n<10?'0':'')+n; };
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function download(json,name){
  var url = URL.createObjectURL(new Blob([json],{type:'application/json'}));
  var a = h('a',{href:url,download:name});
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); },4000);
  toast('Fichier '+name+' créé');
}
function exportFile(){
  var json = JSON.stringify({app:'courses-enseignes',version:1,exported:new Date().toISOString(),
    stores:state.stores,current:state.current,view:state.view},null,2);
  var name = 'courses-'+stamp()+'.json', file = null;
  try{ file = new File([json],name,{type:'application/json'}); }catch(e){}
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:'Sauvegarde des courses'}).catch(function(err){
      if(err && err.name!=='AbortError') download(json,name);
    });
    return;
  }
  download(json,name);
}
function pickFile(){
  var inp = h('input',{type:'file',accept:'.json,application/json,text/plain',style:'display:none'});
  inp.addEventListener('change',function(){
    var f = inp.files && inp.files[0];
    inp.remove();
    if(!f) return;
    var r = new FileReader();
    r.onload = function(){ importFromText(String(r.result)); };
    r.readAsText(f);
  });
  document.body.appendChild(inp);
  inp.click();
}
function importFromText(text){
  var data = null;
  try{ data = JSON.parse(text); }catch(e){}
  data = data && valid(data) ? clean(data) : null;
  if(!data){ toast("Ce n'est pas une sauvegarde valide"); return; }
  importSheet(data);
}
function importSheet(data){
  var np = data.stores.reduce(function(n,x){ return n+x.products.length; },0);
  openSheet(function(sh){
    sh.appendChild(h('h2',null,'Importer la sauvegarde'));
    sh.appendChild(h('p',{class:'hint'},
      data.stores.length+(data.stores.length>1?' enseignes':' enseigne')+' et '+np+(np>1?' produits':' produit')+' dans ce fichier.'));
    sh.appendChild(h('div',{class:'actions'},
      h('button',{type:'button',class:'btn primary',onclick:function(){
        mergeData(data); editing = false; save(); closeSheet(); render();
        toast('Sauvegarde fusionnée');
      }},'Fusionner avec mes données'),
      h('p',{class:'hint'},'Ajoute les enseignes et produits qui te manquent, sans toucher à ta liste actuelle.'),
      h('button',{type:'button',class:'btn',onclick:function(){
        if(!confirm('Remplacer toutes les données de cet appareil par cette sauvegarde ?')) return;
        state = data; editing = false; save(); closeSheet(); render();
        toast('Sauvegarde restaurée');
      }},'Remplacer mes données'),
      h('p',{class:'hint'},"Reprend exactement l'état de la sauvegarde, y compris les produits à acheter."),
      h('button',{type:'button',class:'btn link',onclick:closeSheet},'Annuler')));
  });
}

function backupSheet(){
  openSheet(function(sh){
    sh.appendChild(h('h2',null,'Sauvegarde et synchronisation'));
    sh.appendChild(h('p',{class:'hint'},
      "Exporte un fichier .json, envoie-le sur ton autre appareil (AirDrop, Messages, Fichiers iCloud…), puis importe-le là-bas."));
    sh.appendChild(h('div',{class:'actions'},
      h('button',{type:'button',class:'btn primary',onclick:exportFile},'Exporter un fichier .json'),
      h('button',{type:'button',class:'btn',onclick:pickFile},'Importer un fichier .json'),
      h('button',{type:'button',class:'btn link',onclick:textSheet},'Copier ou coller en texte'),
      h('button',{type:'button',class:'btn link',onclick:closeSheet},'Fermer')));
  });
}

function textSheet(){
  openSheet(function(sh){
    var ta = h('textarea',{'aria-label':'Sauvegarde en texte',spellcheck:'false',autocapitalize:'off'});
    ta.value = JSON.stringify(state);
    sh.appendChild(h('h2',null,'Sauvegarde en texte'));
    sh.appendChild(h('p',{class:'hint'},'Copie ce texte, ou colle ici une sauvegarde venant d’un autre appareil.'));
    sh.appendChild(ta);
    sh.appendChild(h('div',{class:'actions'},
      h('button',{type:'button',class:'btn primary',onclick:function(){
        ta.focus(); ta.select(); ta.setSelectionRange(0,ta.value.length);
        var ok = false;
        try{ ok = document.execCommand('copy'); }catch(e){}
        if(!ok && navigator.clipboard){ navigator.clipboard.writeText(ta.value).then(function(){ toast('Texte copié'); }); return; }
        toast(ok ? 'Texte copié' : 'Sélectionne le texte pour le copier');
      }},'Copier le texte'),
      h('button',{type:'button',class:'btn',onclick:function(){ importFromText(ta.value); }},'Importer ce texte'),
      h('button',{type:'button',class:'btn link',onclick:backupSheet},'Retour')));
  });
}

/* ---------- Événements ---------- */
$('tabBuy').addEventListener('click',function(){ setView('buy'); });
$('tabProd').addEventListener('click',function(){ setView('prod'); });
$('editStore').addEventListener('click',function(){ storeSheet(cur().id); });
$('overlay').addEventListener('click',function(e){ if(e.target===$('overlay')) closeSheet(); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeSheet(); });

var addInput = $('addInput');
$('addForm').addEventListener('submit',function(e){
  e.preventDefault();
  if(addProduct(addInput.value)){ addInput.value = ''; addInput.focus(); }
});
addInput.addEventListener('focus',function(){ document.body.classList.add('typing'); });
addInput.addEventListener('blur',function(){ document.body.classList.remove('typing'); });

/* Icône d'écran d'accueil générée à la volée */
(function(){
  try{
    var c = document.createElement('canvas'); c.width = c.height = 180;
    var x = c.getContext('2d');
    x.fillStyle = '#24323F'; x.fillRect(0,0,180,180);
    var cols = [COLORS[0][1],COLORS[1][1],COLORS[2][1],COLORS[3][1]];
    for(var i=0;i<4;i++){
      var y = 40+i*32;
      x.beginPath(); x.arc(46,y,10,0,Math.PI*2); x.fillStyle = cols[i]; x.fill();
      x.lineCap = 'round'; x.lineWidth = 9; x.strokeStyle = 'rgba(255,255,255,'+(i===0?'1':'.85')+')';
      x.beginPath(); x.moveTo(74,y); x.lineTo(136-(i%2)*22,y); x.stroke();
    }
    $('touchIcon').setAttribute('href',c.toDataURL('image/png'));
  }catch(e){}
})();

render();
})();
</script>
